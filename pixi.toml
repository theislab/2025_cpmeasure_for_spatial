[project]
name = "2025_cpmeasure_for_spatial"
channels = ["conda-forge"]
description = "Application of cp_measure to spatial data"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
ipykernel = ">=6.29.5,<7"
jupyter = ">=1.1.1,<2"
jupyter_client = ">=8.6.3,<9"
spatialdata = ">=0.4.0,<0.5"
spatialdata-plot = ">=0.2.10,<0.3"
numpy = ">=2.2.5,<3"
matplotlib = ">=3.10.3,<4"
pandas = ">=2.2.3,<3"
squidpy = ">=1.6.5,<2"
igraph = ">=0.10.15,<0.11"
python-igraph = ">=0.11.8,<0.12"
leidenalg = ">=0.10.2,<0.11"

[pypi-dependencies]
sopa = ">=2.0.6, <3"
